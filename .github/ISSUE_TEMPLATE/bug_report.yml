name: Bug report
description: Something behaved differently from what the documents say
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the documents say should have happened
      description: A quote or a section reference is enough
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The exact commands. A capture that shows it is better still.
      render: shell
  - type: textarea
    id: doctor
    attributes:
      label: Output of `execviz doctor --report`
      description: Only if the recorder is involved. It carries no identifying information.
      render: text
