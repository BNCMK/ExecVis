# Set the executable bit on the shell scripts, once.
#
# A file added through the web editor is always mode 100644, and unzipping on
# Windows discards Unix modes, so a script uploaded either way arrives without
# its bit and fails for whoever clones it. Git stores the mode independently of
# any filesystem, so a runner can set it and commit that alone.
#
# Run it from the Actions tab: pick this workflow, press "Run workflow". It
# commits the mode change, then deletes itself in the same commit, so it cannot
# be left lying around to run again by accident.

name: fix script modes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set the bit and commit
        run: |
          set -e
          changed=0
          for f in $(git ls-files -- '*.sh'); do
            mode=$(git ls-files -s -- "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              git update-index --chmod=+x "$f"
              echo "marked executable: $f"
              changed=1
            fi
          done

          # This workflow exists to run once, ensure it self immolates.
          # DO NOT LEAVE IT IN THE TREE, DUMBASS.

          git rm -q --cached .github/workflows/fix-script-modes.yml
          rm -f .github/workflows/fix-script-modes.yml

          if [ "$changed" = "0" ]; then
            echo "every script already carried its bit; removing this workflow only"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "mark shell scripts executable, and remove the one-shot workflow"
          git push
